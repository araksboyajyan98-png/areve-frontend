<!doctype html>
<html lang="hy">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Արևէ — նախադպրոցական կենտրոն</title>
    <meta
      name="description"
      content="«Արևէ» նախադպրոցական կենտրոն Աբովյանում՝ 1.5–6 տարեկան երեխաների համար։ Կես օրյա և ամբողջ օրյա ձևաչափեր, փոքր խմբեր, խաղով ուսուցում։"
    />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />

    <!--
      Домен встречается ещё в public/robots.txt, public/sitemap.xml и ниже
      в разметке организации. Меняется — меняется везде, это весь список.
    -->
    <link rel="canonical" href="https://arevecenter.am/" />

    <!-- Как ссылка выглядит в мессенджерах: родители делятся сайтом в WhatsApp. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Արևէ" />
    <meta property="og:title" content="Արևէ — նախադպրոցական կենտրոն Աբովյանում" />
    <meta
      property="og:description"
      content="1.5–6 տարեկան երեխաների համար։ Կես օրյա և ամբողջ օրյա ձևաչափեր, փոքր խմբեր, խաղով ուսուցում, 3-օրյա անվճար ադապտացիա։"
    />
    <meta property="og:url" content="https://arevecenter.am/" />

    <!--
      Картинка отдельная, а не hero.webp, по двум причинам.
      Во-первых, адрес абсолютный: Facebook и WhatsApp забирают её со своей
      стороны, и относительный путь им не к чему привязать — превью выходит
      пустым. Во-вторых, JPEG 1200×630: hero.webp — это 1120×896 в webp,
      его обрезали бы как попало, а webp часть мессенджеров не показывает
      до сих пор. Ради тега, который и нужен-то для пересылки в WhatsApp,
      это решает дело.
    -->
    <meta property="og:image" content="https://arevecenter.am/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Երեխաներ խաղում են փայտե խորանարդիկներով" />

    <meta property="og:locale" content="hy_AM" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+Armenian:wght@500;600;700&family=Noto+Sans+Armenian:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Разметка организации для поиска и карт. Адрес, телефоны и почта
      настоящие. Координат нет: метка на карте ставится по строке адреса,
      то есть примерно. Без них разметка верна, просто менее полна.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ChildCare",
        "name": "Արևէ",
        "url": "https://arevecenter.am/",
        "image": "https://arevecenter.am/og-image.jpg",
        "email": "arevecenter@gmail.com",
        "description": "Նախադպրոցական կենտրոն 1.5–6 տարեկան երեխաների համար",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Երիտասարդական 13",
          "addressLocality": "Աբովյան",
          "addressCountry": "AM"
        },
        "telephone": ["+374 95 313 633", "+374 94 505 552"],
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
          "opens": "08:30",
          "closes": "18:30"
        },
        "sameAs": [
          "https://www.facebook.com/p/%D4%B1%D6%80%D6%87%D5%A7-%D5%A5%D6%80%D5%A5%D5%AD%D5%A1%D5%B6%D5%A5%D6%80%D5%AB-%D5%A6%D5%A2%D5%A1%D5%B2%D5%B4%D5%B8%D6%82%D5%B6%D6%84%D5%AB-%D5%AF%D5%A5%D5%B6%D5%BF%D6%80%D5%B8%D5%B6-61581118524761/",
          "https://www.instagram.com/arevecenter/"
        ]
      }
    </script>

    <!-- Тема до первой отрисовки: иначе мигает неверная. Ключ совпадает с themeStore. -->
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
